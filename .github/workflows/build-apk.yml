name: 构建 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 安装 Android SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: 构建 Debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Niancijian-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error