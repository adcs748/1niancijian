<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>一念词间 · 交互原型</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="android-mobile.css">
</head>
<body>
  <div class="stage">
    <div class="stage-note">
      <strong>一念词间</strong>
      <span>四六级英语 · iOS 交互原型</span>
    </div>

    <div class="phone" id="phone">
      <div class="wallpaper" id="wallpaper"></div>

      <div class="statusbar">
        <span class="clock" id="clock">9:41</span>
        <span class="status-icons">
          <svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true">
            <rect x="0" y="7" width="3" height="4" rx="1" fill="currentColor"/>
            <rect x="4.5" y="5" width="3" height="6" rx="1" fill="currentColor"/>
            <rect x="9" y="3" width="3" height="8" rx="1" fill="currentColor"/>
            <rect x="13.5" y="1" width="3" height="10" rx="1" fill="currentColor"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true">
            <path d="M8 11.2 1.2 4.4a9.6 9.6 0 0 1 13.6 0L8 11.2Z" fill="currentColor"/>
          </svg>
          <span class="battery"><span class="battery-fill"></span></span>
        </span>
      </div>

      <div class="viewport" id="viewport"></div>
      <div class="home-indicator"></div>

      <div class="player-bar" id="playerBar"></div>

      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
      <div class="toast" id="toast"></div>

      <div class="skin-editing-bar" id="skinEditingBar">
        <span>点击任意组件更换底层图案</span>
        <button data-action="exit-skin-editing">完成</button>
      </div>

      <div class="launch-screen" id="launchScreen">
        <div class="launch-media" id="launchMedia"></div>
      </div>

      <input type="file" id="wallpaperInput" accept="image/*" hidden>
      <input type="file" id="skinInput" accept="image/*" hidden>
      <input type="file" id="launchInput" accept="image/jpeg,image/png,image/gif,.jpg,.jpeg,.png,.gif" hidden>
      <input type="file" id="iconInput" accept="image/*" hidden>
      <input type="file" id="ocrInput" accept="image/*" hidden>
      <input type="file" id="backupInput" multiple hidden>
    </div>

    <p class="stage-tip">提示：首页右上角可更换壁纸、应用图标、开机动画与数据导出；导入页支持图片英文识别。</p>
  </div>

  <script src="data/cet4.js"></script>
  <script src="data/cet6.js"></script>
  <script src="data/BANK_CET4.js"></script>
  <script src="data/BANK_CET6.js"></script>
  <script src="grammar.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
