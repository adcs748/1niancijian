<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一念词间 · 数据包查看器</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1c1c1e;
    --text2: #6b7280;
    --accent: #3d6bf5;
    --line: rgba(60, 60, 67, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .page { max-width: 960px; margin: 0 auto; padding: 36px 24px 60px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .logo {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(135deg, #3d6bf5, #7a5cfa);
    color: #fff; display: grid; place-items: center;
    font-weight: 800; font-size: 22px; flex-shrink: 0;
  }
  h1 { font-size: 22px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 12px; color: var(--text2); }
  .card {
    background: var(--card); border-radius: 16px; padding: 18px;
    box-shadow: 0 8px 24px rgba(20, 30, 60, 0.06); margin-bottom: 16px;
  }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  input[type="file"] {
    width: 100%; border: 1px dashed var(--line); border-radius: 12px;
    padding: 14px; background: #fff; font-size: 13px; color: var(--text2);
  }
  input[type="search"] {
    flex: 1; min-width: 200px; border: 0; outline: none;
    background: #f2f3f7; border-radius: 10px; padding: 10px 12px;
    font-size: 14px; color: var(--text);
  }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 130px; background: #f7f8fb; border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 18px; }
  .stat span { font-size: 11px; color: var(--text2); }
  .section-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 4px 0 10px; font-size: 15px; font-weight: 700;
  }
  .section-title span { font-size: 11px; color: var(--text2); font-weight: 400; }
  .item { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .item:last-child { border-bottom: 0; }
  .item-title { font-size: 15px; font-weight: 600; }
  .item-meta { margin-top: 4px; font-size: 11px; color: var(--text2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { padding: 2px 7px; border-radius: 6px; background: #e8edff; color: var(--accent); font-size: 10px; font-weight: 700; }
  .tag.ocr { background: #fff3e0; color: #a35f00; }
  .tag.sentence { background: #f0e9ff; color: #6d46c9; }
  .preview { margin-top: 6px; font-size: 12px; color: var(--text2); line-height: 1.55; }
  details { margin-top: 6px; }
  summary { cursor: pointer; font-size: 12px; color: var(--accent); }
  pre {
    white-space: pre-wrap; word-break: break-word; background: #f7f8fb;
    border-radius: 10px; padding: 12px; font-size: 12px; line-height: 1.6;
    max-height: 320px; overflow: auto;
  }
  .empty { padding: 24px; text-align: center; color: var(--text2); font-size: 13px; }
  .hidden { display: none; }
  footer { margin-top: 24px; font-size: 11px; color: var(--text2); line-height: 1.6; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <span class="logo">念</span>
      <div>
        <h1>一念词间 · 数据包查看器</h1>
        <p>打开你在应用里主动导出的 JSON 数据包；文件只在本机解析，不会上传。</p>
      </div>
    </header>

    <div class="card">
      <input type="file" id="packageInput" accept=".json,application/json">
      <div id="message" class="preview hidden"></div>
    </div>

    <div id="overview" class="card hidden">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <input type="search" id="search" placeholder="搜索文章标题、正文或收藏">
        <span id="packageName" class="preview" style="margin:0"></span>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div id="content"></div>

    <footer>
      说明：此查看器只读取你选择的 JSON 文件，不访问其他文件；数据包仅包含导出时勾选的文章 / 收藏 / 外观配置。
    </footer>
  </div>

  <script>
    (function () {
      var input = document.getElementById('packageInput');
      var message = document.getElementById('message');
      var overview = document.getElementById('overview');
      var stats = document.getElementById('stats');
      var content = document.getElementById('content');
      var search = document.getElementById('search');
      var packageName = document.getElementById('packageName');
      var payload = null;

      input.addEventListener('change', function (event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        packageName.textContent = file.name;
        file.text().then(function (text) {
          payload = JSON.parse(text);
          if (!payload || payload.app !== '一念词间') {
            showMessage('这不是「一念词间」的数据包，或文件已损坏。');
            payload = null;
            overview.classList.add('hidden');
            content.innerHTML = '';
            return;
          }
          message.classList.add('hidden');
          overview.classList.remove('hidden');
          render();
        }).catch(function () {
          showMessage('读取失败：请确认选择的是导出的 .json 数据包。');
          payload = null;
          overview.classList.add('hidden');
          content.innerHTML = '';
        });
      });

      search.addEventListener('input', function () {
        if (payload) render();
      });

      function showMessage(text) {
        message.textContent = text;
        message.classList.remove('hidden');
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }

      function render() {
        var query = (search.value || '').trim().toLowerCase();
        var articles = Array.isArray(payload.articles) ? payload.articles : [];
        var favorites = Array.isArray(payload.favorites) ? payload.favorites : [];
        var appearance = payload.appearance;

        var filteredArticles = articles.filter(function (article) {
          if (!query) return true;
          return String(article.title || '').toLowerCase().indexOf(query) >= 0 ||
            String(article.content || '').toLowerCase().indexOf(query) >= 0;
        });
        var filteredFavorites = favorites.filter(function (fav) {
          if (!query) return true;
          return String(fav.text || '').toLowerCase().indexOf(query) >= 0 ||
            String(fav.translation || '').toLowerCase().indexOf(query) >= 0;
        });

        stats.innerHTML =
          '<div class="stat"><b>' + articles.length + '</b><span>文章 / 识别记录</span></div>' +
          '<div class="stat"><b>' + favorites.length + '</b><span>收藏条目</span></div>' +
          '<div class="stat"><b>' + escapeHtml(payload.exportedAt ? new Date(payload.exportedAt).toLocaleString('zh-CN') : '未知') + '</b><span>导出时间</span></div>' +
          '<div class="stat"><b>' + (appearance ? '包含' : '未包含') + '</b><span>外观配置</span></div>';

        var html = '';
        html += '<div class="card"><div class="section-title">文章与识别记录<span>' + filteredArticles.length + ' 条</span></div>';
        if (!filteredArticles.length) {
          html += '<div class="empty">没有匹配的文章</div>';
        }
        filteredArticles.forEach(function (article) {
          var isOcr = article.kind === 'ocr';
          var tag = isOcr ? '<span class="tag ocr">图片识别</span>' : '<span class="tag">文章</span>';
          var body = String(article.content || '');
          var preview = body.slice(0, 120);
          html += '<div class="item">' +
            '<div class="item-title">' + escapeHtml(article.title || '未命名') + '</div>' +
            '<div class="item-meta">' + tag +
              '<span>' + (article.wordCount || 0) + ' 词</span>' +
              '<span>' + (article.paragraphCount || 0) + ' 段</span>' +
            '</div>' +
            '<div class="preview">' + escapeHtml(preview) + (body.length > 120 ? '…' : '') + '</div>' +
            '<details><summary>展开正文</summary><pre>' + escapeHtml(body) + '</pre></details>' +
            '</div>';
        });
        html += '</div>';

        html += '<div class="card"><div class="section-title">收藏夹<span>' + filteredFavorites.length + ' 条</span></div>';
        if (!filteredFavorites.length) {
          html += '<div class="empty">没有匹配的收藏</div>';
        }
        filteredFavorites.forEach(function (fav) {
          var tag = fav.type === 'sentence'
            ? '<span class="tag sentence">句子</span>'
            : '<span class="tag">单词</span>';
          html += '<div class="item">' +
            '<div class="item-title">' + escapeHtml(fav.text || '') + '</div>' +
            '<div class="item-meta">' + tag + '</div>' +
            '<div class="preview">' + escapeHtml(fav.translation || '暂无译文') + '</div>' +
            '</div>';
        });
        html += '</div>';

        if (appearance) {
          html += '<div class="card"><div class="section-title">外观配置<span>不含图片</span></div>' +
            '<pre>' + escapeHtml(JSON.stringify(appearance, null, 2)) + '</pre></div>';
        }

        content.innerHTML = html;
      }
    })();
  </script>
</body>
</html>
