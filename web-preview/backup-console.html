<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一念词间 · 备份管理台</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1c1c1e;
    --text2: #6b7280;
    --accent: #2f7d5c;
    --line: rgba(60, 60, 67, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .page { max-width: 960px; margin: 0 auto; padding: 34px 24px 60px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .logo {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(135deg, #2f7d5c, #3d6bf5);
    color: #fff; display: grid; place-items: center;
    font-weight: 800; font-size: 22px; flex-shrink: 0;
  }
  h1 { font-size: 21px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 12px; color: var(--text2); }
  .card {
    background: var(--card); border-radius: 16px; padding: 18px;
    box-shadow: 0 8px 24px rgba(20, 30, 60, 0.06); margin-bottom: 16px;
  }
  .config-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input {
    flex: 1; min-width: 160px; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; outline: none; background: #fff; color: var(--text);
  }
  button {
    border: 0; border-radius: 10px; padding: 10px 14px; font-size: 13px;
    font-weight: 700; cursor: pointer; background: var(--accent); color: #fff;
  }
  button.ghost { background: #e9f2ee; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .hint { margin-top: 10px; font-size: 11px; color: var(--text2); line-height: 1.6; }
  .batch {
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
    padding: 12px 14px; border-radius: 12px; background: #f7f8fb;
    margin-top: 8px; cursor: pointer;
  }
  .batch:hover { background: #eef1f7; }
  .batch-id { font-size: 13px; font-weight: 600; }
  .batch-meta { margin-top: 3px; font-size: 11px; color: var(--text2); }
  .section-title { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; font-weight: 700; }
  .section-title span { font-size: 11px; color: var(--text2); font-weight: 400; }
  .file-row {
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
    padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12px;
  }
  .file-row:last-child { border-bottom: 0; }
  .file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-size { color: var(--text2); flex-shrink: 0; }
  .empty { padding: 22px; text-align: center; color: var(--text2); font-size: 13px; }
  .status { margin-top: 10px; font-size: 12px; color: var(--text2); }
  .status.error { color: #c0392b; }
  .hidden { display: none; }
  footer { margin-top: 24px; font-size: 11px; color: var(--text2); line-height: 1.6; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <span class="logo">念</span>
      <div>
        <h1>一念词间 · 备份管理台</h1>
        <p>查看客户授权备份到你服务器的数据；不会访问任何未上传的文件。</p>
      </div>
    </header>

    <div class="card">
      <div class="config-row">
        <input id="serverURL" placeholder="备份服务器地址，例如 https://backup.example.com">
        <input id="token" type="password" placeholder="访问 Token">
        <button id="refresh">连接并刷新</button>
      </div>
      <div class="hint">
        管理台只读取你部署的备份服务接口（/api/backups）。建议在服务器前配置 HTTPS 与访问控制，Token 仅保存在本机浏览器。
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="card">
      <div class="section-title">备份批次<span id="batchCount">0 个</span></div>
      <div id="batches"></div>
    </div>

    <div id="detailCard" class="card hidden">
      <div class="section-title">批次详情<span id="detailTitle"></span></div>
      <div id="detailFiles"></div>
    </div>

    <footer>
      提示：客户追回数据时，在服务器数据目录（DATA_DIR）中按批次 ID 找到文件；本管理台只负责浏览与下载。
    </footer>
  </div>

  <script>
    (function () {
      var serverInput = document.getElementById('serverURL');
      var tokenInput = document.getElementById('token');
      var refreshButton = document.getElementById('refresh');
      var statusEl = document.getElementById('status');
      var batchesEl = document.getElementById('batches');
      var batchCountEl = document.getElementById('batchCount');
      var detailCard = document.getElementById('detailCard');
      var detailTitle = document.getElementById('detailTitle');
      var detailFiles = document.getElementById('detailFiles');

      serverInput.value = localStorage.getItem('backup-console-url') || '';
      tokenInput.value = localStorage.getItem('backup-console-token') || '';

      refreshButton.addEventListener('click', function () {
        localStorage.setItem('backup-console-url', serverInput.value.trim());
        localStorage.setItem('backup-console-token', tokenInput.value.trim());
        loadBatches();
      });

      function baseURL() {
        return serverInput.value.trim().replace(/\/$/, '');
      }

      function headers() {
        var token = tokenInput.value.trim();
        return token ? { Authorization: 'Bearer ' + token } : {};
      }

      function setStatus(text, isError) {
        statusEl.textContent = text || '';
        statusEl.className = 'status' + (isError ? ' error' : '');
      }

      function formatBytes(bytes) {
        if (!bytes) return '0 B';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      }

      function loadBatches() {
        var base = baseURL();
        if (!base) {
          setStatus('请先填写备份服务器地址', true);
          return;
        }
        setStatus('正在连接…');
        fetch(base + '/api/backups', { headers: headers() })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function (items) {
            renderBatches(items);
            setStatus('已连接 · ' + new Date().toLocaleTimeString('zh-CN'));
          })
          .catch(function (error) {
            setStatus('连接失败：' + error.message + '（请确认地址、Token 与 CORS）', true);
            batchesEl.innerHTML = '<div class="empty">无法读取备份列表</div>';
            batchCountEl.textContent = '0 个';
          });
      }

      function renderBatches(items) {
        batchCountEl.textContent = items.length + ' 个';
        if (!items.length) {
          batchesEl.innerHTML = '<div class="empty">服务器上还没有备份批次</div>';
          return;
        }
        batchesEl.innerHTML = items.map(function (item) {
          return '<div class="batch" data-id="' + escapeHtml(item.id) + '">' +
            '<div>' +
              '<div class="batch-id">' + escapeHtml(item.id) + '</div>' +
              '<div class="batch-meta">' + escapeHtml(new Date(item.updatedAt).toLocaleString('zh-CN')) +
                ' · ' + item.fileCount + ' 个文件 · ' + formatBytes(item.totalBytes) + '</div>' +
            '</div>' +
            '<button class="ghost">查看</button>' +
          '</div>';
        }).join('');

        Array.prototype.forEach.call(batchesEl.querySelectorAll('.batch'), function (row) {
          row.addEventListener('click', function () {
            loadDetail(row.getAttribute('data-id'));
          });
        });
      }

      function loadDetail(batchId) {
        var base = baseURL();
        setStatus('正在读取批次 ' + batchId + '…');
        fetch(base + '/api/backups/' + encodeURIComponent(batchId), { headers: headers() })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function (data) {
            detailCard.classList.remove('hidden');
            detailTitle.textContent = batchId + ' · ' + (data.files || []).length + ' 个文件';
            var files = data.files || [];
            if (!files.length) {
              detailFiles.innerHTML = '<div class="empty">该批次没有文件</div>';
              return;
            }
            detailFiles.innerHTML = files.map(function (file, index) {
              return '<div class="file-row">' +
                '<span class="file-name">' + escapeHtml(file.name) + '</span>' +
                '<span class="file-size">' + formatBytes(file.size) + '</span>' +
                '<button class="ghost" data-index="' + index + '">下载</button>' +
              '</div>';
            }).join('');

            Array.prototype.forEach.call(detailFiles.querySelectorAll('button[data-index]'), function (button) {
              button.addEventListener('click', function () {
                var file = files[Number(button.getAttribute('data-index'))];
                downloadFile(batchId, file.name);
              });
            });
            setStatus('已加载批次详情');
          })
          .catch(function (error) {
            setStatus('读取批次失败：' + error.message, true);
          });
      }

      function downloadFile(batchId, name) {
        var base = baseURL();
        setStatus('正在下载 ' + name + '…');
        fetch(base + '/api/backups/' + encodeURIComponent(batchId) + '/files/' + encodeURIComponent(name), {
          headers: headers()
        })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.blob();
          })
          .then(function (blob) {
            var url = URL.createObjectURL(blob);
            var link = document.createElement('a');
            link.href = url;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
            setStatus('已开始下载 ' + name);
          })
          .catch(function (error) {
            setStatus('下载失败：' + error.message, true);
          });
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
        });
      }
    })();
  </script>
</body>
</html>
